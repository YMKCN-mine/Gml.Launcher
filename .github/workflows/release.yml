
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Pre-release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build all platforms
    uses: ./.github/workflows/ci.yml
    with:
      self_contained: true
      build_arm: true
      build_windows: true
      build_linux: true
      build_osx: true
      publish_ready_to_run: true
      hide_pdb: true

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists"
            exit 1
          fi

      - name: Download Launcher-All
        uses: actions/download-artifact@v4
        with:
          name: Launcher-All
          path: artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          find artifacts -type f -name '*.exe' \
            -exec cp --parents {} release-assets/ \;

          mapfile -d '' assets < <(
            find release-assets -type f -name '*.exe' -print0
          )

          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "::error::No .exe files found"
            find artifacts -maxdepth 5 -type f
            exit 1
          fi

          echo "Found ${#assets[@]} executable(s):"
          printf '%s\n' "${assets[@]}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          args=()
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Gml.Launcher $VERSION" \
            --generate-notes \
            "${args[@]}"

      - name: Upload executable assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' assets < <(
            find release-assets -type f -name '*.exe' -print0
          )

          gh release upload "$VERSION" "${assets[@]}"
