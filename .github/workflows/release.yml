
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. gml_v2026.2-1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Pre-release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build all platforms
    uses: ./.github/workflows/ci.yml
    with:
      self_contained: true
      build_arm: true
      build_windows: true
      build_linux: true
      build_osx: true
      publish_ready_to_run: true
      hide_pdb: true

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^gml_v[0-9]+\.[0-9]+-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            echo "Expected format: gml_v2026.2-1.0.0"
            exit 1
          fi

      - name: Download Launcher-All
        uses: actions/download-artifact@v4
        with:
          name: Launcher-All
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          find artifacts -type f -name '*.exe' \
            -exec cp --parents {} release-assets/ \;

          if ! find release-assets -type f -name '*.exe' -print -quit | grep -q .; then
            echo "No .exe files found in Launcher-All"
            find artifacts -maxdepth 5 -type f
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=()

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          mapfile -d '' assets < <(
            find release-assets -type f -name '*.exe' -print0
          )

          gh release create "$VERSION" \
            "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "Gml.Launcher $VERSION" \
            --generate-notes \
            "${args[@]}"
